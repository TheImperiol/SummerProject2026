syntax = "proto2";

package ProtoMessages;

import "ScriptCard.proto";
import "DeviceCard.proto";
import "ComponentCard.proto";

option java_outer_classname = "CardWrapperProto";

message CardWrapper {
    oneof card {
        ScriptCard scriptCard = 1;
        DeviceCard deviceCard = 2;
        ComponentCard componentCard = 3;
    }
}